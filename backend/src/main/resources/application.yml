server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: naukri-ai-job-apply-bot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:../storage/localdb/naukri_ai_job_apply_bot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: backend/logs/naukri-bot.log
  level:
    com.naukri.bot: INFO

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:local-development-jwt-secret-32-char}
    encryption-key: ${APP_ENCRYPTION_KEY:local-development-aes-secret-32char}
    token-expiration-minutes: ${APP_TOKEN_EXPIRATION_MINUTES:720}
    cors-allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  bot:
    storage-dir: ${BOT_STORAGE_DIR:../storage}
    headless: ${BOT_HEADLESS:true}
    dry-run: ${BOT_DRY_RUN:false}
    mock: ${BOT_MOCK:false}
    max-retries: ${BOT_MAX_RETRIES:2}
    proxy-host: ${BOT_PROXY_HOST:}
    proxy-port: ${BOT_PROXY_PORT:}
    proxy-username: ${BOT_PROXY_USERNAME:}
    proxy-password: ${BOT_PROXY_PASSWORD:}
    manual-login-timeout-seconds: ${BOT_MANUAL_LOGIN_TIMEOUT_SECONDS:600}
    question-answer-timeout-seconds: ${BOT_QUESTION_ANSWER_TIMEOUT_SECONDS:600}
  scheduler:
    poll-delay-ms: ${SCHEDULER_POLL_DELAY_MS:60000}
  llm:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  notifications:
    mail-from: ${MAIL_FROM:}
    mail-to: ${MAIL_TO:}
    telegram-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:}
