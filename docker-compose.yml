services:
  postgres:
    image: postgres:16-alpine
    container_name: naukri-bot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naukri_bot}
      POSTGRES_USER: ${POSTGRES_USER:-naukri_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naukri_bot} -d ${POSTGRES_DB:-naukri_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: naukri-bot-backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-naukri_bot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-naukri_bot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: naukri-bot-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
